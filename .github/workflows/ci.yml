# CI = Continuous Integration, plus API CD on green main.
# On every push to main and every pull request, GitHub spins up clean Linux VMs
# and re-runs our automated tests. If any job fails (exit code != 0), the check
# goes red and you know something broke before (or right after) merge.
#
# On push to main only: after both test jobs pass, deploy jobs POST the
# Render and Cloudflare Pages deploy hooks from the `production` Environment
# (RENDER_DEPLOY_HOOK, CLOUDFLARE_PAGES_DEPLOY_HOOK). Turn off Git auto-deploy
# on both hosts so only this workflow ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch if you push again quickly
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: compile + JUnit (H2 test profile — no real Postgres needed)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          # Caches ~/.m2 so dependency downloads are fast on later runs
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -B test

  # ---------------------------------------------------------------------------
  # Frontend: install deps, Jest smoke tests, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Caches npm based on package-lock.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci = clean install exactly from package-lock (reproducible; preferred in CI)
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Production build
        # Catches broken imports / build-time env issues even if tests pass
        run: npm run build
        env:
          # CRA bakes this in at build time; a placeholder is enough for CI compile
          REACT_APP_API_URL: http://localhost:8080

  # ---------------------------------------------------------------------------
  # API CD: Render deploy hook (Environment secret). Skipped on pull requests.
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  # ---------------------------------------------------------------------------
  # Frontend CD: Cloudflare Pages deploy hook. Skipped on pull requests.
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy frontend
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Cloudflare Pages
        run: curl -fsS -X POST "${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}"
