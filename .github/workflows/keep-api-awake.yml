# Ping Render so the free instance sleeps less often.
# GitHub does not start this schedule until it has run at least once on main:
#   Actions → Keep API awake → Run workflow
# Cron can still drift; */5 is the shortest GitHub allows vs Render's ~15 min idle sleep.
# Override URLs with repo variables API_HEALTH_URL / API_BLOG_URL if the hostname changes.

name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Ping health and /blog
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          BLOG_URL: ${{ vars.API_BLOG_URL }}
        run: |
          HEALTH="${HEALTH_URL:-https://portfolio-blog-it8m.onrender.com/actuator/health}"
          BLOG="${BLOG_URL:-https://portfolio-blog-it8m.onrender.com/blog}"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 20 --max-time 120 "$HEALTH"
          curl -fsS --retry 2 --retry-all-errors --retry-delay 15 --max-time 120 -o /dev/null "$BLOG"
