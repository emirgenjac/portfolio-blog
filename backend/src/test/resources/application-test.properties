spring.datasource.url=jdbc:h2:mem:blog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-search-chunk-h2.sql

jwt.secret=test-jwt-secret-key-at-least-32-bytes-long
jwt.expiration=3600000

app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.max-age-seconds=3600
app.cors.allowed-origins=http://localhost:3000
app.rate-limit.login.max-attempts=1000
app.rate-limit.login.window-seconds=60
app.rate-limit.search.max-attempts=1000
app.rate-limit.search.window-seconds=60

app.embeddings.enabled=true
app.embeddings.api-key=
app.embeddings.pgvector=false
app.embeddings.timeout-ms=1000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

logging.level.org.springframework.security=WARN
