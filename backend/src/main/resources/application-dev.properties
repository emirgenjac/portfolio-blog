# Local development profile (default via spring.profiles.active=dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=TRACE
logging.level.com.emirgenjac.blog=DEBUG

# Cookies: HTTP localhost — Secure must be false; Lax is fine (same-site ports)
app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.max-age-seconds=604800

