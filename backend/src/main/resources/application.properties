# Shared defaults (safe to commit). Secrets come from env vars or application-local.properties.
spring.application.name=blog
# Default: dev + optional local overrides (application-local.properties, gitignored).
# Production hosts should set SPRING_PROFILES_ACTIVE=prod (do not include local).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,local}

# Datasource — URL/username defaults for local; password must NOT be committed.
# Set password via env SPRING_DATASOURCE_PASSWORD (relaxed binding) or application-local.properties.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — JWT_SECRET must be set in the environment (or IDE run config)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Login rate limit (per client IP, rolling window)
app.rate-limit.login.max-attempts=${APP_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
app.rate-limit.login.window-seconds=${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] - %msg%n
