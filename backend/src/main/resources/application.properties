spring.application.name=blog
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,local}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.rate-limit.login.max-attempts=${APP_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
app.rate-limit.login.window-seconds=${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.rate-limit.search.max-attempts=${APP_RATE_LIMIT_SEARCH_MAX_ATTEMPTS:30}
app.rate-limit.search.window-seconds=${APP_RATE_LIMIT_SEARCH_WINDOW_SECONDS:60}

app.embeddings.enabled=${APP_EMBEDDINGS_ENABLED:true}
app.embeddings.api-key=${EMBEDDING_API_KEY:}
app.embeddings.base-url=${APP_EMBEDDINGS_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.embeddings.model=${APP_EMBEDDINGS_MODEL:text-embedding-004}
app.embeddings.dimensions=${APP_EMBEDDINGS_DIMENSIONS:768}
app.embeddings.timeout-ms=${APP_EMBEDDINGS_TIMEOUT_MS:4000}
app.embeddings.pgvector=${APP_EMBEDDINGS_PGVECTOR:true}

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] - %msg%n
