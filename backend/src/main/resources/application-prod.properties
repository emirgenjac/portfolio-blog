# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# Secrets must come from the host environment (never from this file).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.com.emirgenjac.blog=INFO

# Cookies: HTTPS required. SameSite=None for cross-site FE/API (e.g. Pages + Render).
# If you later put FE+API on the same site (api.yourdomain.com), set APP_COOKIE_SAME_SITE=Lax.
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:None}
app.cookie.max-age-seconds=${APP_COOKIE_MAX_AGE_SECONDS:604800}

